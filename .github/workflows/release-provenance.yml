name: Automatic Windows release

on:
  workflow_run:
    workflows: [MSBuild]
    types: [completed]

# This privileged workflow never checks out or executes triggering content. It
# only accepts artifacts from a successful push run in this repository's
# default branch, waits for the matching CMake run, then publishes the exact
# archives already attested by MSBuild.
permissions:
  actions: read
  contents: write

concurrency:
  group: automatic-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated Windows archives
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dgcore-main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Wait for the matching CMake run
        id: cmake
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

            for (let attempt = 1; attempt <= 60; attempt++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'cmake.yml',
                head_sha: sha,
                event: 'push',
                per_page: 20,
              });

              const runs = response.data.workflow_runs.filter(run =>
                run.head_sha === sha && run.event === 'push');
              const successful = runs.find(run =>
                run.status === 'completed' && run.conclusion === 'success');

              if (successful) {
                core.setOutput('run-id', successful.id.toString());
                core.setOutput('run-url', successful.html_url);
                return;
              }

              const active = runs.some(run => run.status !== 'completed');
              if (runs.length > 0 && !active) {
                const results = runs.map(run => `${run.id}:${run.conclusion}`).join(', ');
                core.setFailed(`CMake did not succeed for ${sha}: ${results}`);
                return;
              }

              core.info(`CMake result for ${sha} is not ready (attempt ${attempt}/60)`);
              await delay(30000);
            }

            core.setFailed(`Timed out waiting for CMake to validate ${sha}`);

      - name: Download the attested MSBuild artifacts
        uses: actions/download-artifact@v5
        with:
          name: renderdox-windows-release
          path: ${{ runner.temp }}/release-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          asset_root="${RUNNER_TEMP}/release-assets"
          msvc=("${asset_root}"/renderdox-*-windows-x64-msvc-release.zip)
          clang=("${asset_root}"/renderdox-*-windows-x64-clangcl-release.zip)
          manifest=("${asset_root}"/renderdox-*-windows-x64-manifest.json)

          [[ ${#msvc[@]} -eq 1 ]]
          [[ ${#clang[@]} -eq 1 ]]
          [[ ${#manifest[@]} -eq 1 ]]
          [[ -f "${asset_root}/SHA256SUMS.txt" ]]
          [[ $(find "${asset_root}" -maxdepth 1 -type f | wc -l) -eq 4 ]]
          (cd "${asset_root}" && sha256sum --check SHA256SUMS.txt)

      - name: Create the continuous pre-release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MSBUILD_URL: ${{ github.event.workflow_run.html_url }}
          CMAKE_URL: ${{ steps.cmake.outputs.run-url }}
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA:0:12}"
          tag="continuous-${short_sha}"
          title="RenderDox development build ${short_sha}"
          asset_root="${RUNNER_TEMP}/release-assets"
          notes="${RUNNER_TEMP}/release-notes.md"

          previous_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name != \"${tag}\") | select(.tag_name | startswith(\"continuous-\")) | .tag_name" \
              | sed -n '1p'
          )"

          {
            printf '# RenderDox development build %s\n\n' "${short_sha}"
            printf 'This build contains changes from `dgcore-main` through [%s](https://github.com/%s/commit/%s).\n\n' \
              "${short_sha}" "${GITHUB_REPOSITORY}" "${HEAD_SHA}"
            printf '**NOTE**: This is an automated development snapshot and may be less stable than a versioned release. It is maintained by the RenderDox project and is not an upstream RenderDoc release.\n\n'
            printf 'Windows x64 binaries built with MSVC and ClangCL are available below.\n\n'
            printf '# Changes\n\n'
            if [[ -n "${previous_tag}" ]]; then
              printf 'Changes since [%s](https://github.com/%s/releases/tag/%s) can be reviewed in the [full comparison](https://github.com/%s/compare/%s...%s).\n\n' \
                "${previous_tag}" "${GITHUB_REPOSITORY}" "${previous_tag}" \
                "${GITHUB_REPOSITORY}" "${previous_tag}" "${HEAD_SHA}"
            else
              printf 'This is the first RenderDox continuous build after synchronising with upstream RenderDoc `v1.x`.\n\n'
            fi
            printf '# Packages\n\n'
            printf '* `renderdox-%s-windows-x64-msvc-release.zip` - MSVC Release build.\n' "${short_sha}"
            printf '* `renderdox-%s-windows-x64-clangcl-release.zip` - ClangCL Release build.\n' "${short_sha}"
            printf '* `renderdox-%s-windows-x64-manifest.json` - Package manifest.\n' "${short_sha}"
            printf '* `SHA256SUMS.txt` - SHA-256 checksums for the published files.\n\n'
            printf '# Validation\n\n'
            printf '* [CMake](%s)\n' "${CMAKE_URL}"
            printf '* [MSBuild](%s)\n\n' "${MSBUILD_URL}"
            printf 'The archives have GitHub build-provenance attestations. Verify a downloaded archive with `gh attestation verify <archive> --repo %s`.\n' \
              "${GITHUB_REPOSITORY}"
          } > "${notes}"

          assets=("${asset_root}"/*)
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --prerelease
          else
            gh release create "${tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${HEAD_SHA}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --prerelease
          fi

          release_url=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)
          printf 'url=%s\n' "${release_url}" >> "${GITHUB_OUTPUT}"
          printf '### Automatic release\n\n[%s](%s)\n' "${title}" "${release_url}" >> "${GITHUB_STEP_SUMMARY}"
