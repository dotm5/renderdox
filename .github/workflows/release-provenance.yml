name: Windows release provenance

on:
  release:
    types: [published]
  workflow_dispatch:

# The OpenSSF generic generator previously suggested by GitHub is no longer
# actively maintained. actions/attest is GitHub's maintained replacement and
# emits signed in-toto SLSA build provenance for the exact release archives.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-provenance-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  QRENDERDOC_THIRDPARTY_URL: https://renderdoc.org/qrenderdoc_3rdparty.zip
  QRENDERDOC_THIRDPARTY_SHA256: 9FDF4B298DF843571120FF139B745B4183D9C332B157F1982F4242C96E038F1C

jobs:
  windows-release:
    name: Build, attest, and publish
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 5
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Download pinned QRenderDoc dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'qrenderdoc_3rdparty.zip'
          & curl.exe --fail --location --retry 3 --output $archive $env:QRENDERDOC_THIRDPARTY_URL
          if($LASTEXITCODE -ne 0) { throw "Dependency download failed with exit code $LASTEXITCODE" }

          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if($actual -ne $env:QRENDERDOC_THIRDPARTY_SHA256)
          {
            throw "QRenderDoc dependency hash mismatch: $actual"
          }

          & 7z x $archive -y
          if($LASTEXITCODE -ne 0) { throw "Dependency extraction failed with exit code $LASTEXITCODE" }

      - name: Build the complete Windows release matrix
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          ./util/buildscripts/build_windows_release_matrix.ps1 `
            -Target Rebuild `
            -ChildPropagation OneGeneration `
            -MaxCpuCount 4 `
            -OutputDirectory $output `
            -IncludeBootstrap

      - name: Create release archives
        shell: pwsh
        run: |
          $matrixRoot = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $assetRoot = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $assetRoot | Out-Null

          $label = if('${{ github.event_name }}' -eq 'release') {
            '${{ github.event.release.tag_name }}'
          } else {
            (git rev-parse --short=10 HEAD).Trim()
          }
          $label = $label -replace '[^A-Za-z0-9._-]', '-'

          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $source = Join-Path $matrixRoot $package
            $archive = Join-Path $assetRoot "renderdox-$label-windows-x64-$package.zip"
            Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal
          }

          Copy-Item -LiteralPath (Join-Path $matrixRoot 'manifest.json') `
            -Destination (Join-Path $assetRoot "renderdox-$label-windows-x64-manifest.json")

          Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            Write-Host "$hash  $($_.Name)"
          }

      - name: Generate signed SLSA build provenance
        uses: actions/attest@v4
        with:
          subject-path: '${{ runner.temp }}/release-assets/*'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renderdox-windows-release
          path: '${{ runner.temp }}/release-assets/*'
          if-no-files-found: error
          retention-days: 30

      - name: Attach assets to the GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assetRoot = Join-Path $env:RUNNER_TEMP 'release-assets'
          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | Select-Object -ExpandProperty FullName)
          & gh release upload $env:RELEASE_TAG @assets --clobber
          if($LASTEXITCODE -ne 0) { throw "Release upload failed with exit code $LASTEXITCODE" }
