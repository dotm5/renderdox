name: Automatic Windows release

on:
  workflow_run:
    workflows: [MSBuild]
    types: [completed]

# This privileged workflow never checks out or executes triggering content. It
# only accepts artifacts from a successful push run in this repository's
# default branch, waits for the matching CMake run, then publishes the exact
# archives already attested by MSBuild.
permissions:
  actions: read
  contents: write

concurrency:
  group: automatic-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated Windows archives
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dgcore-main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Wait for the matching CMake run
        id: cmake
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

            for (let attempt = 1; attempt <= 60; attempt++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'cmake.yml',
                head_sha: sha,
                event: 'push',
                per_page: 20,
              });

              const runs = response.data.workflow_runs.filter(run =>
                run.head_sha === sha && run.event === 'push');
              const successful = runs.find(run =>
                run.status === 'completed' && run.conclusion === 'success');

              if (successful) {
                core.setOutput('run-id', successful.id.toString());
                core.setOutput('run-url', successful.html_url);
                return;
              }

              const active = runs.some(run => run.status !== 'completed');
              if (runs.length > 0 && !active) {
                const results = runs.map(run => `${run.id}:${run.conclusion}`).join(', ');
                core.setFailed(`CMake did not succeed for ${sha}: ${results}`);
                return;
              }

              core.info(`CMake result for ${sha} is not ready (attempt ${attempt}/60)`);
              await delay(30000);
            }

            core.setFailed(`Timed out waiting for CMake to validate ${sha}`);

      - name: Download the attested MSBuild artifacts
        uses: actions/download-artifact@v5
        with:
          name: renderdox-windows-release
          path: ${{ runner.temp }}/release-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          asset_root="${RUNNER_TEMP}/release-assets"
          msvc=("${asset_root}"/renderdox-*-windows-x64-msvc-release.zip)
          clang=("${asset_root}"/renderdox-*-windows-x64-clangcl-release.zip)
          manifest=("${asset_root}"/renderdox-*-windows-x64-manifest.json)

          [[ ${#msvc[@]} -eq 1 ]]
          [[ ${#clang[@]} -eq 1 ]]
          [[ ${#manifest[@]} -eq 1 ]]
          [[ -f "${asset_root}/SHA256SUMS.txt" ]]
          [[ $(find "${asset_root}" -maxdepth 1 -type f | wc -l) -eq 4 ]]
          (cd "${asset_root}" && sha256sum --check SHA256SUMS.txt)

      - name: Create the continuous pre-release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MSBUILD_URL: ${{ github.event.workflow_run.html_url }}
          CMAKE_URL: ${{ steps.cmake.outputs.run-url }}
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA:0:12}"
          tag="continuous-${short_sha}"
          title="RenderDox continuous ${short_sha}"
          asset_root="${RUNNER_TEMP}/release-assets"
          notes="${RUNNER_TEMP}/release-notes.md"

          printf '%s\n' \
            "Continuous RenderDox pre-release for [${HEAD_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${HEAD_SHA})." \
            '' \
            'Validated by:' \
            "- [CMake](${CMAKE_URL})" \
            "- [MSBuild](${MSBUILD_URL})" \
            '' \
            'The Windows MSVC and ClangCL archives were built from the same commit and have GitHub artifact attestations. Verify their hashes with SHA256SUMS.txt.' \
            > "${notes}"

          assets=("${asset_root}"/*)
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${HEAD_SHA}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --prerelease
          fi

          release_url=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)
          printf 'url=%s\n' "${release_url}" >> "${GITHUB_OUTPUT}"
          printf '### Automatic release\n\n[%s](%s)\n' "${title}" "${release_url}" >> "${GITHUB_STEP_SUMMARY}"
