name: MSBuild

on:
  push:
    branches: [dgcore-main, 'feat/**']
    paths-ignore:
      # Built-in skill Markdown is executable analysis content and must build.
      - '*.md'
      - '**/README.md'
      - '**/ReadMe.md'
      - '**/readme.md'
      - '**/LICENSE.md'
      - '**/README.txt'
      - '**/ReadMe.txt'
      - '**/readme.txt'
      - '**/LICENSE.txt'
      - '**/License.txt'
      - '**/NOTICE.txt'
      - '**/NOTICES.txt'
      - '**/CHANGELOG.txt'
      - '**/AUTHORS.txt'
      - '**/CONTRIBUTORS.txt'
      - 'assets/readme/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull.yml'
      - 'docs/**'
  pull_request:
    branches: [dgcore-main]
    paths-ignore:
      # Built-in skill Markdown is executable analysis content and must build.
      - '*.md'
      - '**/README.md'
      - '**/ReadMe.md'
      - '**/readme.md'
      - '**/LICENSE.md'
      - '**/README.txt'
      - '**/ReadMe.txt'
      - '**/readme.txt'
      - '**/LICENSE.txt'
      - '**/License.txt'
      - '**/NOTICE.txt'
      - '**/NOTICES.txt'
      - '**/CHANGELOG.txt'
      - '**/AUTHORS.txt'
      - '**/CONTRIBUTORS.txt'
      - 'assets/readme/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      cold_build:
        description: 'Skip restoring build results and populate fresh caches'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: msbuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QRENDERDOC_THIRDPARTY_URL: https://renderdoc.org/qrenderdoc_3rdparty.zip
  QRENDERDOC_THIRDPARTY_SHA256: 9FDF4B298DF843571120FF139B745B4183D9C332B157F1982F4242C96E038F1C
  # This shared policy is part of the exact native-package cache identity.
  NATIVE_BUILD_PROFILE: '{"configuration":"Release","platform":"x64","child_propagation":"AllGenerations","include_bootstrap":true,"ltcg":false,"compiler_cache":"sccache-v0.18.0-no-pch-z7-v1"}'

jobs:
  contracts:
    name: Windows build contracts
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Resolve the stable Windows build environment
        shell: pwsh
        run: |
          . ./util/buildscripts/windows_toolchain.ps1
          Get-DCompWindowsToolchain | Format-List

      - name: Validate generated product identity
        shell: pwsh
        run: python util/buildscripts/generate_product_identity.py --check

      - name: Validate runtime identity contracts
        shell: pwsh
        run: ./util/buildscripts/check_windows_identity_contracts.ps1

      - name: Validate solution and build contracts
        shell: pwsh
        run: ./util/buildscripts/check_windows_build_contracts.ps1 -Configuration Release -Platform x64

  native:
    name: ${{ matrix.toolchain }} x64 Release
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        toolchain: [MSVC, ClangCL]
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: '2G'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Set up sccache
        id: sccache
        uses: Mozilla-Actions/sccache-action@v0.0.11
        with:
          version: 'v0.18.0'
          disable_annotations: 'true'

      - name: Initialize compiler cache and available CPU parallelism
        id: compiler-env
        shell: pwsh
        run: |
          ./util/buildscripts/initialize_windows_compiler_cache.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sccache-compilers')

      - name: Fingerprint native build inputs
        id: native-inputs
        shell: pwsh
        run: |
          python util/buildscripts/native_build_inputs.py `
            --profile-json $env:NATIVE_BUILD_PROFILE `
            --output (Join-Path $env:RUNNER_TEMP 'native-inputs.json')
          if($LASTEXITCODE -ne 0) { throw 'Native input fingerprint failed' }

      # Exact input identity can reuse the complete native stage across MCP-only
      # changes. Its original producer commit is retained in the final manifest.
      - name: Restore complete native package
        id: native-package
        if: ${{ !inputs.cold_build }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/dcomp-native
          key: native-package-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ steps.compiler-env.outputs.toolchain-key }}-${{ steps.native-inputs.outputs.native-inputs-digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-package-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ steps.compiler-env.outputs.toolchain-key }}-${{ steps.native-inputs.outputs.native-inputs-digest }}-

      - name: Restore compiler results for changed native inputs
        if: ${{ !inputs.cold_build && steps.native-package.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: windows-sccache-v1-${{ matrix.toolchain }}-${{ steps.compiler-env.outputs.compiler-key }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-sccache-v1-${{ matrix.toolchain }}-${{ steps.compiler-env.outputs.compiler-key }}-

      - name: Cache pinned QRenderDoc dependency archive
        if: steps.native-package.outputs.cache-matched-key == ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qrenderdoc_3rdparty.zip
          key: qrenderdoc-dependencies-v1-${{ env.QRENDERDOC_THIRDPARTY_SHA256 }}

      - name: Prepare pinned QRenderDoc dependencies
        if: steps.native-package.outputs.cache-matched-key == ''
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'qrenderdoc_3rdparty.zip'
          if(-not (Test-Path -LiteralPath $archive -PathType Leaf))
          {
            & curl.exe --fail --location --retry 3 --output $archive $env:QRENDERDOC_THIRDPARTY_URL
            if($LASTEXITCODE -ne 0) { throw "Dependency download failed with exit code $LASTEXITCODE" }
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if($actual -ne $env:QRENDERDOC_THIRDPARTY_SHA256)
          {
            throw "QRenderDoc dependency hash mismatch: $actual"
          }
          & 7z x $archive -y
          if($LASTEXITCODE -ne 0) { throw "Dependency extraction failed with exit code $LASTEXITCODE" }

      - name: Verify real compiler cache hits and invalidation
        if: matrix.toolchain == 'MSVC' && steps.native-package.outputs.cache-matched-key == ''
        shell: pwsh
        run: |
          ./util/buildscripts/check_windows_compiler_cache.ps1 `
            -CacheToolDirectory $env:RDocSccacheCompilerDir `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sccache-smoke') `
            -MaxCpuCount ([Environment]::ProcessorCount)

      - name: Build and validate the native package
        id: native-build
        if: steps.native-package.outputs.cache-matched-key == ''
        shell: pwsh
        env:
          BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-native'
          # A partial cache download must not leave an apparent package behind.
          if(Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          $profile = $env:NATIVE_BUILD_PROFILE | ConvertFrom-Json
          if($profile.configuration -ne 'Release' -or $profile.platform -ne 'x64' -or $profile.ltcg)
          {
            throw 'The release matrix currently supports the x64 fast Release profile'
          }
          ./util/buildscripts/build_windows_release_matrix.ps1 `
            -Target Rebuild `
            -Toolchains $env:BUILD_TOOLCHAIN `
            -ChildPropagation $profile.child_propagation `
            -MaxCpuCount ([Environment]::ProcessorCount) `
            -OutputDirectory $output `
            -NativeInputsManifest (Join-Path $env:RUNNER_TEMP 'native-inputs.json') `
            -IncludeBootstrap:([bool]$profile.include_bootstrap)

      # Persist native work before MCP packaging/test steps on another runner.
      - name: Flush compiler cache writes
        if: ${{ always() && (steps.native-build.outcome == 'success' || steps.native-build.outcome == 'failure') }}
        continue-on-error: true
        shell: pwsh
        run: |
          $stats = & sccache --stop-server 2>&1
          $stats | ForEach-Object { Write-Host $_ }
          @('### Compiler cache statistics', '', '```text') + @($stats) + @('```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Save compiler results
        if: ${{ always() && (steps.native-build.outcome == 'success' || steps.native-build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: windows-sccache-v1-${{ matrix.toolchain }}-${{ steps.compiler-env.outputs.compiler-key }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save complete native package
        if: steps.native-build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/dcomp-native
          key: native-package-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ steps.compiler-env.outputs.toolchain-key }}-${{ steps.native-inputs.outputs.native-inputs-digest }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report native cache result
        if: ${{ always() }}
        shell: pwsh
        env:
          CACHE_TOOLCHAIN: ${{ matrix.toolchain }}
          NATIVE_CACHE_HIT: ${{ steps.native-package.outputs.cache-matched-key != '' }}
          NATIVE_INPUTS_DIGEST: ${{ steps.native-inputs.outputs.native-inputs-digest }}
        run: |
          @(
            "### $env:CACHE_TOOLCHAIN native cache",
            '',
            "Complete native package reused: $env:NATIVE_CACHE_HIT",
            "Native inputs: $env:NATIVE_INPUTS_DIGEST",
            "Parallel compiler tasks: $([Environment]::ProcessorCount)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload native package for assembly
        uses: actions/upload-artifact@v7
        with:
          name: renderdox-native-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/dcomp-native/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: true

      - name: Upload compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compiler-diagnostics-${{ matrix.toolchain }}
          path: |
            build/logs/
            ${{ runner.temp }}/sccache-smoke/
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

  build:
    name: Assemble and validate portable releases
    needs: native
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Set up portable MCP packaging Python
        uses: actions/setup-python@v7
        with:
          # Match the supported packaging range against the Actions manifest.
          python-version: '>=3.12 <3.16'
          check-latest: true
          allow-prereleases: false
          cache: pip
          cache-dependency-path: tools/renderdoc-mcp/packaging/requirements.txt

      - name: Set up JDK for the owned JVM host fixture
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true

      - name: Download MSVC native package
        uses: actions/download-artifact@v8
        with:
          name: renderdox-native-MSVC
          path: ${{ runner.temp }}/dcomp-native/MSVC

      - name: Download ClangCL native package
        uses: actions/download-artifact@v8
        with:
          name: renderdox-native-ClangCL
          path: ${{ runner.temp }}/dcomp-native/ClangCL

      - name: Merge native packages with their producer identities
        shell: pwsh
        env:
          ASSEMBLY_COMMIT: ${{ github.sha }}
        run: |
          python util/buildscripts/merge_windows_release_matrix.py `
            --input-root (Join-Path $env:RUNNER_TEMP 'dcomp-native/MSVC') `
            --input-root (Join-Path $env:RUNNER_TEMP 'dcomp-native/ClangCL') `
            --output-directory (Join-Path $env:RUNNER_TEMP 'dcomp-release') `
            --source-commit $env:ASSEMBLY_COMMIT
          if($LASTEXITCODE -ne 0) { throw 'Native release assembly failed' }

      - name: Prepare packaging environment and run source tests
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $venv = Join-Path $env:RUNNER_TEMP 'mcp-build-venv'
          python -m venv $venv
          if($LASTEXITCODE -ne 0) { throw 'MCP packaging environment failed' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check -r tools/renderdoc-mcp/packaging/requirements.txt
          if($LASTEXITCODE -ne 0) { throw 'MCP packaging dependencies failed' }
          & $python -m unittest discover -s tools/renderdoc-mcp/tests -p 'test_*.py'
          if($LASTEXITCODE -ne 0) { throw 'MCP source tests failed' }
          & $python -m unittest discover -s tools/proxy-builder/tests -p 'test_*.py'
          if($LASTEXITCODE -ne 0) { throw 'Proxy Builder source tests failed' }

      - name: Fingerprint the fixture toolchain
        id: fixture-env
        shell: pwsh
        run: |
          ./util/buildscripts/initialize_windows_compiler_cache.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'fixture-toolchain') `
            -FingerprintOnly

      - name: Fingerprint native fixture inputs
        id: fixture-inputs
        shell: pwsh
        env:
          FIXTURE_TOOLCHAIN_KEY: ${{ steps.fixture-env.outputs.toolchain-key }}
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'mcp-build-venv/Scripts/python.exe'
          # The shared helper excludes Python bytecode created by source tests.
          # Checkout timestamps in .pyc files would otherwise defeat every hit.
          $sourceDigest = & $python -c "import sys; sys.path.insert(0, 'tools/proxy-builder/tests'); from fixture_build_cache import source_fingerprint; print(source_fingerprint())"
          if($LASTEXITCODE -ne 0) { throw 'Unable to fingerprint fixture sources' }
          $pythonVersion = & $python -c 'import sys; print(sys.version)'
          if($LASTEXITCODE -ne 0) { throw 'Unable to fingerprint fixture Python' }
          $dependencies = & $python -m pip freeze --all --disable-pip-version-check
          if($LASTEXITCODE -ne 0) { throw 'Unable to fingerprint fixture dependencies' }
          $identity = [ordered]@{
            policy = 'static-routes-mixed-both-v1'
            toolchain = $env:FIXTURE_TOOLCHAIN_KEY
            sources = $sourceDigest
            python = $python
            python_version = $pythonVersion
            dependencies = @($dependencies | Sort-Object)
            java_home = $env:JAVA_HOME
            java_release = Get-Content -LiteralPath (Join-Path $env:JAVA_HOME 'release') -Raw
          } | ConvertTo-Json -Depth 4 -Compress
          $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
            [Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant()
          $key = "fixture-builds-v1-$digest"
          "cache-prefix=$key" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "RENDERDOX_FIXTURE_CACHE_KEY=$key" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Restore compiled native test fixtures
        id: fixture-cache
        if: ${{ !inputs.cold_build }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/developer-native-acceptance
            ${{ runner.temp }}/developer-route-acceptance
            ${{ runner.temp }}/developer-mixed-acceptance
          key: ${{ steps.fixture-inputs.outputs.cache-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.fixture-inputs.outputs.cache-prefix }}-

      - name: Verify restored fixture compilation outputs
        id: fixture-cache-check
        shell: pwsh
        env:
          FIXTURE_CACHE_MATCH: ${{ steps.fixture-cache.outputs.cache-matched-key }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $python = Join-Path $env:RUNNER_TEMP 'mcp-build-venv/Scripts/python.exe'
          $roots = [ordered]@{
            static = (Join-Path $env:RUNNER_TEMP 'developer-native-acceptance')
            routes = (Join-Path $env:RUNNER_TEMP 'developer-route-acceptance')
            mixed = (Join-Path $env:RUNNER_TEMP 'developer-mixed-acceptance')
          }
          $valid = -not [string]::IsNullOrEmpty($env:FIXTURE_CACHE_MATCH)
          foreach($entry in $roots.GetEnumerator())
          {
            if($valid)
            {
              & $python tools/proxy-builder/tests/fixture_build_cache.py verify `
                --root $entry.Value --kind $entry.Key
              if($LASTEXITCODE -ne 0) { $valid = $false }
            }
          }
          if(-not $valid)
          {
            foreach($path in $roots.Values)
            {
              if(Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            }
          }
          "reuse=$($valid.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Native fixture compilation reused: $valid"
          "Native fixture compilation reused: $valid; tests execute in this run." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          # A rejected cache is a cold build, not a failed test.
          exit 0

      - name: Run native fixture acceptance
        id: fixture-tests
        shell: pwsh
        env:
          REUSE_FIXTURE_BUILDS: ${{ steps.fixture-cache-check.outputs.reuse }}
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'mcp-build-venv/Scripts/python.exe'
          $native = Join-Path $env:RUNNER_TEMP 'developer-native-acceptance'
          $routes = Join-Path $env:RUNNER_TEMP 'developer-route-acceptance'
          $reuse = $env:REUSE_FIXTURE_BUILDS -eq 'true'
          $reuseArguments = @()
          if($reuse) { $reuseArguments = @('--reuse-builds') }
          ./tools/proxy-builder/tests/run_static_acceptance.ps1 `
            -Python $python -OutputDirectory $native -Toolchain Both -ReuseBuilds:$reuse
          & $python tools/proxy-builder/tests/run_route_acceptance.py `
            --output $routes --toolchain Both @reuseArguments
          if($LASTEXITCODE -ne 0) { throw 'Proxy route acceptance failed' }
          & $python tools/proxy-builder/tests/run_mixed_acceptance.py `
            --fixtures $routes --output (Join-Path $env:RUNNER_TEMP 'developer-mixed-acceptance') `
            @reuseArguments
          if($LASTEXITCODE -ne 0) { throw 'Mixed route acceptance failed' }

      - name: Save compiled native test fixtures
        if: steps.fixture-tests.outcome == 'success' && steps.fixture-cache-check.outputs.reuse != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/developer-native-acceptance
            ${{ runner.temp }}/developer-route-acceptance
            ${{ runner.temp }}/developer-mixed-acceptance
          key: ${{ steps.fixture-inputs.outputs.cache-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bundle portable MCP service and compatible worker
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'mcp-build-venv/Scripts/python.exe'
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $native = Join-Path $env:RUNNER_TEMP 'developer-native-acceptance'
          & $python tools/renderdoc-mcp/packaging/bundle.py `
            --package-root (Join-Path $output 'msvc-release') `
            --package-root (Join-Path $output 'clangcl-release') `
            --build-root (Join-Path $env:RUNNER_TEMP 'mcp-freeze') `
            --matrix-manifest (Join-Path $output 'manifest.json') `
            --native-acceptance $native
          if($LASTEXITCODE -ne 0) { throw 'Portable MCP packaging failed' }

      - name: Verify packaged Python and Qt bindings
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $packagingPythonDll = python -c "import sys; print('python%d%d.dll' % sys.version_info[:2])"
          if($LASTEXITCODE -ne 0) { throw 'Unable to resolve the packaging Python ABI' }
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $root = Join-Path $output $package
            $manifest = Get-Content -LiteralPath (Join-Path $root 'manifest.json') -Raw |
              ConvertFrom-Json
            if(-not $manifest.runtime_closure_verified -or -not $manifest.pyside2)
            {
              throw "$package is missing its verified PySide2 runtime"
            }

            $pythonDll = $manifest.python_abi
            $pythonZip = "python$($manifest.python_major_minor).zip"
            if($pythonDll -notmatch '^python3[0-9]+\.dll$')
            {
              throw "$package has an invalid Python ABI: $pythonDll"
            }
            foreach($relative in @(
                $pythonDll, $pythonZip, '_ctypes.pyd',
                'pymodules\renderdoc.pyd', 'pymodules\qrenderdoc.pyd',
                'shiboken2.dll', 'PySide2\pyside2.dll',
                'PySide2\QtCore.pyd', 'PySide2\QtGui.pyd', 'PySide2\QtWidgets.pyd',
                'Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll',
                'qtplugins\platforms\qwindows.dll',
                'libcrypto-1_1-x64.dll', 'libssl-1_1-x64.dll',
                'bootstrap\dxgi_proxy\dxgi.dll',
                'bootstrap\d3d11_proxy\d3d11.dll',
                'bootstrap\d3d12_proxy\d3d12.dll',
                'bootstrap\aftermath_proxy\GFSDK_Aftermath_Lib.x64.dll',
                'renderdoc-mcp.exe', 'mcp\component-manifest.json',
                'mcp\worker-runtime\python.exe', 'mcp\source\worker\entry.py',
                "mcp-runtime\$packagingPythonDll",
                'mcp\source\skills\game-rendering-analysis\SKILL.md',
                'mcp\source\skills\game-rendering-analysis-en\SKILL.md',
                'developer-tools\component-manifest.json',
                'developer-tools\proxy-builder\proxy-builder.exe',
                "developer-tools\proxy-builder\builder-runtime\$packagingPythonDll",
                'developer-tools\proxy-builder\runtime-templates\bootstrap\aftermath_proxy\aftermath_forward.asm',
                'developer-tools\proxy-builder\route-templates\templates\route_runtime.cpp',
                'developer-tools\proxy-builder\route-templates\vendor\openxr\LICENSE-MIT',
                'developer-tools\capture-doctor\include\api\app\renderdoc_app.h',
                'developer-tools\capture-doctor\bin\MSVC\d3d12-order.exe',
                'developer-tools\capture-doctor\bin\ClangCL\d3d12-order.exe'))
            {
              if(-not (Test-Path -LiteralPath (Join-Path $root $relative) -PathType Leaf))
              {
                throw "$package is missing $relative"
              }
            }
            Write-Host "$package includes $pythonDll, PySide2/Shiboken2, Qt and four bootstrap DLLs"
          }

      - name: Smoke-test packaged command line executables
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $identity = Get-Content -LiteralPath 'build/product_identity.json' -Raw | ConvertFrom-Json
          $command = "$($identity.commandBaseName).exe"
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $executable = Join-Path (Join-Path $output $package) $command
            & $executable version
            if($LASTEXITCODE -ne 0) { throw "$package command line smoke test failed" }

            $testLog = Join-Path $env:RUNNER_TEMP "$package-unit-tests.log"
            # Release can compile out ENABLE_UNIT_TESTS. This checks the entry
            # point's exit status, not native unit-test coverage. Tool source
            # tests and owned fixture assertions above provide counted checks.
            & $executable test unit -o $testLog
            if($LASTEXITCODE -ne 0) { throw "$package core unit tests failed; inspect $testLog" }
          }

      - name: Create portable release archives
        shell: pwsh
        run: |
          $matrixRoot = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $assetRoot = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null

          $label = (git rev-parse --short=12 HEAD).Trim()
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $source = Join-Path $matrixRoot $package
            $archive = Join-Path $assetRoot "renderdox-$label-windows-x64-$package.zip"
            Compress-Archive -Path (Join-Path $source '*') `
              -DestinationPath $archive -CompressionLevel Fastest
          }

          Copy-Item -LiteralPath (Join-Path $matrixRoot 'manifest.json') `
            -Destination (Join-Path $assetRoot "renderdox-$label-windows-x64-manifest.json")

          $checksums = Get-ChildItem -LiteralPath $assetRoot -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $assetRoot 'SHA256SUMS.txt') `
            -Encoding ascii
          $checksums | ForEach-Object { Write-Host $_ }

      - name: Verify contents of the release archives
        shell: pwsh
        run: |
          $assetRoot = Join-Path $env:RUNNER_TEMP 'release-assets'
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $archive = @(Get-ChildItem -LiteralPath $assetRoot -File `
              -Filter "renderdox-*-windows-x64-$package.zip")
            if($archive.Count -ne 1) { throw "Expected one $package archive" }
            $unpacked = Join-Path $env:RUNNER_TEMP "verify-$package"
            Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $unpacked
            $manifest = Get-Content -LiteralPath (Join-Path $unpacked 'manifest.json') -Raw |
              ConvertFrom-Json
            foreach($file in $manifest.files)
            {
              $path = Join-Path $unpacked $file.path
              if(-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                 (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $file.sha256)
              {
                throw "$package archive has a missing or altered file: $($file.path)"
              }
            }
            python util/buildscripts/check_windows_runtime_closure.py $unpacked --quiet
            if($LASTEXITCODE -ne 0) { throw "$package archive has missing DLL dependencies" }
            $python = Join-Path $env:RUNNER_TEMP 'mcp-build-venv/Scripts/python.exe'
            & $python tools/renderdoc-mcp/tests/skill_acceptance.py `
              --package $unpacked --output (Join-Path $env:RUNNER_TEMP "skill-acceptance-$package")
            if($LASTEXITCODE -ne 0) { throw "$package archived MCP skill acceptance failed" }
            & $python tools/proxy-builder/tests/frozen_acceptance.py `
              --package $unpacked --fixtures (Join-Path $env:RUNNER_TEMP 'developer-native-acceptance') `
              --output (Join-Path $env:RUNNER_TEMP "builder-acceptance-$package")
            if($LASTEXITCODE -ne 0) { throw "$package archived Builder acceptance failed" }
            Write-Host "$package archive verified: $($manifest.files.Count) files"
          }

      - name: Generate signed build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/dgcore-main'
        uses: actions/attest@v4
        with:
          subject-path: '${{ runner.temp }}/release-assets/*'

      - name: Upload portable release archives
        uses: actions/upload-artifact@v7
        with:
          name: renderdox-windows-release
          path: '${{ runner.temp }}/release-assets/*'
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          # Release ZIPs are already compressed; avoid recompressing them.
          compression-level: 0

