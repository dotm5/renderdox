name: MSBuild

on:
  push:
    branches: [dgcore-main, 'feat/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [dgcore-main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msbuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QRENDERDOC_THIRDPARTY_URL: https://renderdoc.org/qrenderdoc_3rdparty.zip
  QRENDERDOC_THIRDPARTY_SHA256: 9FDF4B298DF843571120FF139B745B4183D9C332B157F1982F4242C96E038F1C

jobs:
  contracts:
    name: Windows build contracts
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Validate generated product identity
        shell: pwsh
        run: python util/buildscripts/generate_product_identity.py --check

      - name: Validate runtime identity contracts
        shell: pwsh
        run: ./util/buildscripts/check_windows_identity_contracts.ps1

      - name: Validate solution and build contracts
        shell: pwsh
        run: ./util/buildscripts/check_windows_build_contracts.ps1 -Configuration Release -Platform x64

  build:
    name: MSVC and ClangCL x64 Release
    needs: contracts
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Download pinned QRenderDoc dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'qrenderdoc_3rdparty.zip'
          & curl.exe --fail --location --retry 3 --output $archive $env:QRENDERDOC_THIRDPARTY_URL
          if($LASTEXITCODE -ne 0) { throw "Dependency download failed with exit code $LASTEXITCODE" }

          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if($actual -ne $env:QRENDERDOC_THIRDPARTY_SHA256)
          {
            throw "QRenderDoc dependency hash mismatch: $actual"
          }

          & 7z x $archive -y
          if($LASTEXITCODE -ne 0) { throw "Dependency extraction failed with exit code $LASTEXITCODE" }

      - name: Build and validate the Windows release matrix
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          ./util/buildscripts/build_windows_release_matrix.ps1 `
            -Target Rebuild `
            -ChildPropagation AllGenerations `
            -MaxCpuCount 4 `
            -OutputDirectory $output `
            -IncludeBootstrap

      - name: Set up portable MCP packaging Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bundle portable MCP service and compatible worker
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $venv = Join-Path $env:RUNNER_TEMP 'mcp-build-venv'
          python -m venv $venv
          if($LASTEXITCODE -ne 0) { throw 'MCP packaging environment failed' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check -r tools/renderdoc-mcp/packaging/requirements.txt
          if($LASTEXITCODE -ne 0) { throw 'MCP packaging dependencies failed' }
          & $python tools/renderdoc-mcp/packaging/bundle.py `
            --package-root (Join-Path $output 'msvc-release') `
            --package-root (Join-Path $output 'clangcl-release') `
            --build-root (Join-Path $env:RUNNER_TEMP 'mcp-freeze') `
            --matrix-manifest (Join-Path $output 'manifest.json')
          if($LASTEXITCODE -ne 0) { throw 'Portable MCP packaging failed' }

      - name: Verify packaged Python and Qt bindings
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $root = Join-Path $output $package
            $manifest = Get-Content -LiteralPath (Join-Path $root 'manifest.json') -Raw |
              ConvertFrom-Json
            if(-not $manifest.runtime_closure_verified -or -not $manifest.pyside2)
            {
              throw "$package is missing its verified PySide2 runtime"
            }

            $pythonDll = $manifest.python_abi
            $pythonZip = "python$($manifest.python_major_minor).zip"
            if($pythonDll -notmatch '^python3[0-9]+\.dll$')
            {
              throw "$package has an invalid Python ABI: $pythonDll"
            }
            foreach($relative in @(
                $pythonDll, $pythonZip, '_ctypes.pyd',
                'pymodules\renderdoc.pyd', 'pymodules\qrenderdoc.pyd',
                'shiboken2.dll', 'PySide2\pyside2.dll',
                'PySide2\QtCore.pyd', 'PySide2\QtGui.pyd', 'PySide2\QtWidgets.pyd',
                'Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll',
                'qtplugins\platforms\qwindows.dll',
                'libcrypto-1_1-x64.dll', 'libssl-1_1-x64.dll',
                'bootstrap\dxgi_proxy\dxgi.dll',
                'bootstrap\d3d11_proxy\d3d11.dll',
                'bootstrap\d3d12_proxy\d3d12.dll',
                'bootstrap\aftermath_proxy\GFSDK_Aftermath_Lib.x64.dll',
                'renderdoc-mcp.exe', 'mcp\component-manifest.json',
                'mcp\worker-runtime\python.exe', 'mcp\source\worker\entry.py',
                'mcp-runtime\python312.dll'))
            {
              if(-not (Test-Path -LiteralPath (Join-Path $root $relative) -PathType Leaf))
              {
                throw "$package is missing $relative"
              }
            }
            Write-Host "$package includes $pythonDll, PySide2/Shiboken2, Qt and four bootstrap DLLs"
          }

      - name: Smoke-test packaged command line executables
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $identity = Get-Content -LiteralPath 'build/product_identity.json' -Raw | ConvertFrom-Json
          $command = "$($identity.commandBaseName).exe"
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $executable = Join-Path (Join-Path $output $package) $command
            & $executable version
            if($LASTEXITCODE -ne 0) { throw "$package command line smoke test failed" }

            $testLog = Join-Path $env:RUNNER_TEMP "$package-unit-tests.log"
            & $executable test unit -o $testLog
            if($LASTEXITCODE -ne 0) { throw "$package core unit tests failed; inspect $testLog" }
          }

      - name: Create portable release archives
        shell: pwsh
        run: |
          $matrixRoot = Join-Path $env:RUNNER_TEMP 'dcomp-release'
          $assetRoot = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null

          $label = (git rev-parse --short=12 HEAD).Trim()
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $source = Join-Path $matrixRoot $package
            $archive = Join-Path $assetRoot "renderdox-$label-windows-x64-$package.zip"
            Compress-Archive -Path (Join-Path $source '*') `
              -DestinationPath $archive -CompressionLevel Optimal
          }

          Copy-Item -LiteralPath (Join-Path $matrixRoot 'manifest.json') `
            -Destination (Join-Path $assetRoot "renderdox-$label-windows-x64-manifest.json")

          $checksums = Get-ChildItem -LiteralPath $assetRoot -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $assetRoot 'SHA256SUMS.txt') `
            -Encoding ascii
          $checksums | ForEach-Object { Write-Host $_ }

      - name: Verify contents of the release archives
        shell: pwsh
        run: |
          $assetRoot = Join-Path $env:RUNNER_TEMP 'release-assets'
          foreach($package in @('msvc-release', 'clangcl-release'))
          {
            $archive = @(Get-ChildItem -LiteralPath $assetRoot -File `
              -Filter "renderdox-*-windows-x64-$package.zip")
            if($archive.Count -ne 1) { throw "Expected one $package archive" }
            $unpacked = Join-Path $env:RUNNER_TEMP "verify-$package"
            Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $unpacked
            $manifest = Get-Content -LiteralPath (Join-Path $unpacked 'manifest.json') -Raw |
              ConvertFrom-Json
            foreach($file in $manifest.files)
            {
              $path = Join-Path $unpacked $file.path
              if(-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                 (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $file.sha256)
              {
                throw "$package archive has a missing or altered file: $($file.path)"
              }
            }
            python util/buildscripts/check_windows_runtime_closure.py $unpacked --quiet
            if($LASTEXITCODE -ne 0) { throw "$package archive has missing DLL dependencies" }
            Write-Host "$package archive verified: $($manifest.files.Count) files"
          }

      - name: Generate signed build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/dgcore-main'
        uses: actions/attest@v4
        with:
          subject-path: '${{ runner.temp }}/release-assets/*'

      - name: Upload portable release archives
        uses: actions/upload-artifact@v7
        with:
          name: renderdox-windows-release
          path: '${{ runner.temp }}/release-assets/*'
          if-no-files-found: error
          retention-days: 30
